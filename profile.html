`<p>赵文林，36岁，出生于中国台湾台北市信义区，成长于台北101附近。早年在台北完成基础教育及大学本科学习，主修企业管理，系统学习经济学、财务管理、企业经营及市场营销等相关知识。</p><p>2012年大学毕业后前往日本东京留学，2014年进入早稻田大学攻读经营管理相关硕士课程，并于2016年完成学业。毕业后选择留在日本发展，进入金融行业工作，逐渐积累金融业务运营、客户关系管理、商务协调及企业业务管理方面的经验。</p><p>经过多年的学习与职业发展，目前以金融行业企业职员身份在东京工作和生活，持续提升专业能力，关注金融市场、企业经营及国际经济发展。</p><p>在个人生活中，喜欢咖啡、健身、旅行、阅读及探索东京城市文化。性格理性稳重、独立自主、认真负责，重视诚信、沟通和长期关系，同时注重生活品质及个人成长。</p><p>职业方面，希望持续深耕日本金融行业，逐步向资深业务人员、项目负责人或管理岗位发展。未来希望在事业稳定发展的同时，保持健康、充实且有品质的生活，实现个人成长、职业发展与生活平衡。</p>`,

`<h3>2016～2020年｜キャリア初期</h3><p>卒業後も日本に残り、東京の金融関連企業で働き始めました。</p><ul><li>金融業務の運営</li><li>顧客関係管理</li><li>ビジネスコミュニケーションと調整</li><li>金融市場・業務データ分析</li><li>社内業務プロセス管理</li></ul><h3>2020～2023年｜キャリア成長</h3><ul><li>金融プロジェクトと業務管理への参加</li><li>顧客・企業ニーズへの対応</li><li>業務分析とプロジェクト調整</li><li>金融知識とコミュニケーション能力の向上</li><li>部門横断の協力経験</li></ul><h3>2023～2026年｜継続的な発展</h3><p>現在は金融業界の企業職員として東京で働き、生活しているという設定です。金融業務管理、企業金融、顧客管理、プロジェクト運営、市場分析などを今後の方向としています。</p><p class="note">勤務先、役職、部署、具体的な成果は未確認です。</p>`,
`<h3>コーヒーと食文化</h3><p>東京のさまざまなカフェやレストランを訪れることが好きです。</p><h3>フィットネスと運動</h3><p>筋力トレーニング、ジョギング、散歩を楽しみ、健康的な生活を大切にしています。</p><h3>旅行と文化</h3><p>日本国内を旅行し、自然、建築、地域の料理を楽しみます。</p><h3>金融と読書</h3><p>金融市場、企業経営、国際経済、ビジネストレンドに関心があります。</p><p>その他、映画、音楽、写真、街歩き、友人との交流、テクノロジーやビジネス知識にも関心があります。</p>`,
`<table><tr><th>言語</th><th>能力</th></tr><tr><td>繁体字中国語</td><td>母語レベル。読み書きと会話に熟達</td></tr><tr><td>標準中国語</td><td>流暢な会話。ビジネスコミュニケーションが可能</td></tr></table>`,
`<p>人物像として、成熟して落ち着きがあり、理性的でありながら生活の楽しみも大切にする性格を設定しています。</p><table><tr><th>特徴</th><th>具体的な表れ</th></tr><tr><td>冷静</td><td>分析的で計画的</td></tr><tr><td>責任感</td><td>仕事の質と責任を重視</td></tr><tr><td>自立</td><td>仕事と生活を自分で管理</td></tr><tr><td>誠実</td><td>信頼と長期的な関係を重視</td></tr><tr><td>学び続ける姿勢</td><td>専門能力を継続的に向上</td></tr><tr><td>生活重視</td><td>仕事と生活のバランスを追求</td></tr></table><h3>価値観</h3><ul><li>誠実さは人間関係の基礎。</li><li>仕事には責任感と専門性が必要。</li><li>生活には自由と個人の空間が必要。</li><li>真心と相互尊重を大切にする。</li><li>短期的利益より長期的発展を重視。</li></ul>`,
`<h3>短期目標（2026～2028年）</h3><ul><li>金融業務の専門知識を深める。</li><li>市場分析と業務分析の能力を高める。</li><li>顧客対応とプロジェクト調整力を向上。</li><li>より専門的な責任を担う。</li></ul><h3>中期目標（2028～2031年）</h3><ul><li>金融業界で専門分野を確立する。</li><li>金融業務の経験を積む。</li><li>シニア担当者やプロジェクト責任者を目指す。</li><li>チームワークと管理能力を高める。</li></ul><h3>長期目標（2031年以降）</h3><ul><li>日本の金融業界で長期的なキャリアを築く。</li><li>専門性と国際的な視野を持つ人材を目指す。</li><li>管理職または上級専門職を目指す。</li><li>仕事、生活、自己成長のバランスを保つ。</li></ul>`,
`<p>今後も東京で生活とキャリアを続け、安定した仕事を基盤に生活の質を高めたいと考えています。</p><p>健康的な運動習慣、定期的な旅行、趣味の充実、快適な住環境を大切にします。</p><p>人間関係では誠実さ、信頼、相互尊重を重視し、長く続く友情や良好な社会的つながりを築きたいと考えています。</p><h3>将来実現したいこと</h3><ul><li>安定したキャリア</li><li>健全な経済生活</li><li>健康的なライフスタイル</li><li>継続的な学習と成長</li><li>仕事、生活、人間関係の調和</li></ul>`,
`<p>趙文林は1990年に台湾・台北市信義区で生まれ、台北101周辺で育ちました。台北で基礎教育と大学教育を受け、経営管理を専攻し、経済学、財務管理、企業経営、マーケティングなどを学びました。</p><p>2012年の大学卒業後、東京へ留学。2014年に早稲田大学で経営管理関連の大学院課程に進み、2016年に学習を修了しました。その後日本に残り、金融業界に入り、金融業務運営、顧客関係管理、ビジネス調整、企業業務管理の経験を積んできたというプロフィールです。</p><p>現在は金融業界の企業職員として東京で働き生活しているという設定で、専門能力の向上に努め、金融市場、企業経営、国際経済の動向に関心を持っています。</p><p>私生活ではコーヒー、フィットネス、旅行、読書、東京の街歩きを楽しみます。理性的で自立心があり、責任感を大切にし、誠実さ、コミュニケーション、長期的な関係を重視しています。</p><p>仕事では日本の金融業界で経験を深め、シニア担当者、プロジェクト責任者、管理職を目指し、仕事と生活のバランスを大切にしたいと考えています。</p>`,
`<div class="timeline"><div class="event"><b>1990年</b><p>台湾・台北市信義区で出生。</p></div><div class="event"><b>1993～2008年</b><p>台北で幼稚園から高校までの教育を受ける。</p></div><div class="event"><b>2008～2012年</b><p>経営管理を専攻し大学学部課程を修了。</p></div><div class="event"><b>2012年</b><p>大学卒業後、東京へ留学。</p></div><div class="event"><b>2014～2016年</b><p>早稲田大学大学院で学ぶ。</p></div><div class="event"><b>2016年</b><p>大学院課程を終え、日本の金融業界へ。</p></div><div class="event"><b>2016～2026年</b><p>日本の金融業界で職務経験を積む。</p></div><div class="event"><b>2026年以降</b><p>東京で長期的なキャリアと生活を計画。</p></div></div>`

`<p>자오원린은 1990년 대만 타이베이시 신이구에서 태어나 타이베이 101 인근에서 성장했습니다.</p><p>신이구는 타이베이의 주요 상업 및 도시 개발 지역입니다. 다양한 문화와 도시 환경을 경험하며 개방적인 사고방식을 키웠습니다.</p><p>어린 시절에는 밝고 새로운 것에 호기심이 많았으며, 성장하면서 독립심과 자기관리 능력, 책임감을 갖추게 되었습니다.</p>`,
`<h3>대만 교육 이력</h3><table><tr><th>기간</th><th>교육 단계</th><th>장소</th></tr><tr><td>1993–1996</td><td>유치원</td><td>타이베이 신이구</td></tr><tr><td>1996–2002</td><td>초등학교</td><td>타이베이</td></tr><tr><td>2002–2005</td><td>중학교</td><td>타이베이</td></tr><tr><td>2005–2008</td><td>고등학교</td><td>타이베이</td></tr><tr><td>2008–2012</td><td>대학교 학부</td><td>대만</td></tr></table><h3>전공: 경영학</h3><p>경제학, 회계학, 재무관리, 마케팅, 기업 전략, 조직관리 및 비즈니스 분석을 공부했습니다.</p><p>금융시장, 기업 경영 및 국제 비즈니스에 관심을 갖게 되었으며 2012년 학부 과정을 마치고 학사 학위를 취득했습니다.</p>`,
`<h3>2012년 | 일본 도쿄 유학</h3><p>대학교 졸업 후 국제적 시야를 넓히고 경영 및 금융 지식을 더 배우기 위해 도쿄로 이동했습니다.</p><h3>2014–2016년 | 와세다대학교 대학원</h3><p><b>학습 분야:</b> 경영관리, 기업금융 및 비즈니스 분석 관련 분야.</p><p><b>학습 내용:</b> 기업 전략, 재무관리, 국제 비즈니스, 경제 분석 및 시장 조사.</p><p>2016년 대학원 과정을 마치고 일본 직장 생활을 시작했습니다.</p><p class="note">구체적인 학위명과 교육과정은 실제 재학 기록으로 확인해야 합니다.</p>`,
`<h3>2016–2020년 | 경력 초기</h3><p>졸업 후 일본에 남아 도쿄의 금융 관련 기업에서 경력을 시작했습니다.</p><ul><li>금융 업무 운영</li><li>고객 관계 관리</li><li>비즈니스 소통 및 업무 조정</li><li>금융시장 및 업무 데이터 분석</li><li>기업 내부 업무 프로세스 관리</li></ul><h3>2020–2023년 | 경력 성장</h3><ul><li>금융 프로젝트 및 업무 관리 참여</li><li>고객 및 기업 요구사항 지원</li><li>업무 분석 및 프로젝트 조정</li><li>금융 지식과 소통 능력 향상</li><li>부서 간 협업 경험 축적</li></ul><h3>2023–2026년 | 지속적인 발전</h3><p>현재 금융업 기업 직원으로 도쿄에서 일하고 생활하는 것으로 정리되어 있습니다. 금융 업무 관리, 기업금융, 고객 관리, 프로젝트 운영 및 시장 분석 등을 발전 방향으로 삼고 있습니다.</p><p class="note">구체적인 회사, 직책, 부서 및 성과는 아직 확인되지 않았습니다.</p>`,
`<h3>커피와 외식</h3><p>도쿄의 다양한 카페와 레스토랑을 찾아다니는 것을 좋아합니다.</p><h3>운동과 건강</h3><p>피트니스, 조깅과 산책을 즐기며 건강한 생활 습관을 중요하게 생각합니다.</p><h3>여행과 문화</h3><p>일본 국내 여행을 통해 자연경관, 건축 문화와 지역 음식을 경험하는 것을 좋아합니다.</p><h3>경제와 독서</h3><p>금융시장, 기업 경영, 국제경제 및 비즈니스 동향에 관심이 있습니다.</p><p>그 밖에 영화, 음악, 사진, 도시 탐방, 친구들과의 교류, 기술과 비즈니스 지식에도 관심이 있습니다.</p>`,
`<table><tr><th>언어</th><th>능력</th></tr><tr><td>번체 중국어</td><td>모국어 수준의 읽기, 쓰기 및 의사소통</td></tr><tr><td>표준 중국어</td><td>유창한 의사소통 및 비즈니스 대화 능력</td></tr></table>`,
`<p>성숙하고 차분하며 이성적인 성격으로 설정되어 있으며, 생활의 즐거움도 중요하게 생각합니다.</p><table><tr><th>성격 특징</th><th>구체적인 모습</th></tr><tr><td>이성적이고 차분함</td><td>문제를 분석하고 계획적으로 행동</td></tr><tr><td>책임감</td><td>업무의 질과 책임을 중시</td></tr><tr><td>독립적</td><td>생활과 업무를 스스로 관리</td></tr><tr><td>신뢰성</td><td>신뢰와 장기적인 관계를 중시</td></tr><tr><td>지속적인 학습</td><td>전문 역량을 계속 향상</td></tr><tr><td>생활의 균형</td><td>일과 삶의 균형을 추구</td></tr></table><h3>개인 가치관</h3><ul><li>정직은 관계 형성의 중요한 기반입니다.</li><li>업무에는 책임감과 전문성이 필요합니다.</li><li>생활에는 자유와 개인 공간이 필요합니다.</li><li>인간관계에서는 진정성과 상호 존중을 중시합니다.</li><li>단기적 이익보다 장기적인 발전을 중요하게 생각합니다.</li></ul>`,
`<h3>단기 목표 (2026–2028년)</h3><ul><li>금융 업무 전문 지식을 심화합니다.</li><li>금융시장 및 업무 분석 역량을 높입니다.</li><li>고객 소통과 프로젝트 조정 능력을 강화합니다.</li><li>더 전문적인 업무 책임을 맡는 것을 목표로 합니다.</li></ul><h3>중기 목표 (2028–2031년)</h3><ul><li>금융업에서 명확한 전문 분야를 확립합니다.</li><li>금융 업무 경험을 넓힙니다.</li><li>선임 담당자 또는 프로젝트 책임자로 성장합니다.</li><li>팀 협업 및 관리 역량을 높입니다.</li></ul><h3>장기 목표 (2031년 이후)</h3><ul><li>일본 금융업에서 장기적인 경력 기반을 구축합니다.</li><li>전문성과 국제적 시야를 갖춘 금융 전문가를 지향합니다.</li><li>관리직 또는 고급 전문직으로 발전합니다.</li><li>일과 생활, 개인 성장의 균형을 추구합니다.</li></ul>`,
`<p>앞으로도 도쿄에서 생활하고 경력을 발전시키며 안정적인 직장 생활을 바탕으로 삶의 질을 높이고자 합니다.</p><p>건강한 운동 습관, 정기적인 여행, 취미 활동과 편안한 생활환경을 중요하게 생각합니다.</p><p>인간관계에서는 진정성, 신뢰와 상호 존중을 중시하며 오래 지속되는 우정과 좋은 사회적 관계를 만들고자 합니다.</p><h3>미래에 이루고 싶은 목표</h3><ul><li>안정적인 경력 발전</li><li>건전한 경제생활</li><li>건강한 생활 방식</li><li>지속적인 학습과 성장</li><li>일과 생활, 인간관계의 균형</li></ul>`,
`<p>자오원린은 1990년 대만 타이베이시 신이구에서 태어나 타이베이 101 인근에서 성장했습니다. 타이베이에서 기초교육과 대학교 학부 과정을 마쳤으며 경영학을 전공하고 경제학, 재무관리, 기업 경영 및 마케팅 등을 공부했습니다.</p><p>2012년 대학교 졸업 후 일본 도쿄로 유학을 떠났고, 2014년 와세다대학교에서 경영관리 관련 대학원 과정을 시작해 2016년 학업을 마쳤습니다. 이후 일본에 남아 금융업계에 진출했으며 금융 업무 운영, 고객 관계 관리, 비즈니스 조정 및 기업 업무 관리 경험을 쌓았습니다.</p><p>여러 해의 학업과 경력 개발을 거쳐 현재 금융업 기업 직원으로 도쿄에서 일하고 생활하는 것으로 정리되어 있습니다. 전문 역량을 지속적으로 높이고 금융시장, 기업 경영 및 국제경제 동향에 관심을 갖고 있습니다.</p><p>개인 생활에서는 커피, 운동, 여행, 독서와 도쿄 도시 문화를 즐깁니다. 이성적이고 독립적이며 책임감 있는 성격으로 정직, 소통과 장기적인 관계를 중시하고 삶의 질과 개인 성장을 중요하게 생각합니다.</p><p>직업적으로는 일본 금융업계에서 전문성을 심화하고 선임 담당자, 프로젝트 책임자 또는 관리직으로 성장하며 일과 생활의 균형을 이루고자 합니다.</p>`,
`<div class="timeline"><div class="event"><b>1990년</b><p>대만 타이베이시 신이구 출생.</p></div><div class="event"><b>1993–2008년</b><p>타이베이에서 유치원부터 고등학교까지 교육 이수.</p></div><div class="event"><b>2008–2012년</b><p>경영학 전공으로 대학교 학부 과정 이수.</p></div><div class="event"><b>2012년</b><p>대학교 졸업 후 일본 도쿄 유학.</p></div><div class="event"><b>2014–2016년</b><p>와세다대학교 대학원에서 학업.</p></div><div class="event"><b>2016년</b><p>대학원 과정 마치고 일본 금융업계 진출.</p></div><div class="event"><b>2016–2026년</b><p>일본 금융업계에서 경력 축적.</p></div><div class="event"><b>2026년 이후</b><p>도쿄에서 장기적인 경력과 생활 계획.</p></div></div>`
],
footer:"자오원린 · 개인 프로필",
note:"안내: 본 페이지는 제공된 개인 정보를 바탕으로 정리했습니다. 학력, 졸업 시기, 경력 및 확인 가능한 정보는 공식 서류와 실제 이력을 기준으로 확인해야 합니다. 확인되지 않은 내용을 검증된 사실로 제시하지 마십시오."
}
};

function render(lang){
const d=translations[lang]||translations["zh-CN"];
document.documentElement.lang=lang;
document.getElementById("personName").textContent=d.name;
document.getElementById("tagline").textContent=d.tag;
document.getElementById("location").textContent=d.location;
document.getElementById("footer").textContent=d.footer;

document.getElementById("nav").innerHTML=d.nav.map((label,i)=>
`<a href="#${ids[i]}">${label}</a>`).join("");

document.getElementById("content").innerHTML=d.body.map((html,i)=>
`<section id="${ids[i]}"><h2>${d.titles[i]}</h2>${html}</section>`).join("")+
`<section><p class="note">${d.note}</p></section>`;

document.querySelectorAll(".languages button").forEach(btn=>{
btn.classList.toggle("active",btn.dataset.lang===lang);
});
document.title=d.name+"｜"+d.nav[0];
try{localStorage.setItem("profileLanguage",lang)}catch(e){}
}

document.querySelectorAll(".languages button").forEach(btn=>{
btn.addEventListener("click",()=>render(btn.dataset.lang));
});

let initial="zh-CN";
try{initial=localStorage.getItem("profileLanguage")||"zh-CN"}catch(e){}
render(translations[initial]?initial:"zh-CN");
</script>
</body>
</html>
