function render(lang) {
  const profile = profiles[lang];
  document.documentElement.lang = lang;
  document.getElementById("subtitle").textContent = profile.subtitle;
  document.getElementById("footerText").textContent = profile.footer;

  const navigation = document.getElementById("navigation");
  const content = document.getElementById("content");

  navigation.innerHTML = "";
  content.innerHTML = "";

  profile.sections.forEach((section,index) => {
    const id = "section-" + index;

    // 导航直接使用章节标题，保证名称和目标始终一致
    const link = document.createElement("a");
    link.href = "#" + id;
    link.textContent = section[0];
    navigation.appendChild(link);

    const sectionElement = document.createElement("section");
    sectionElement.id = id;

    const heading = document.createElement("h2");
    heading.className = "section-title";
    heading.textContent = section[0];
    sectionElement.appendChild(heading);

    if(index === 0) {
      const grid = document.createElement("div");
      grid.className = "profile-grid";

      section[1].forEach(item => {
        const card = document.createElement("div");
        card.className = "profile-item";

        const label = document.createElement("span");
        label.textContent = item[0];

        const value = document.createElement("strong");
        value.textContent = item[1];

        card.append(label,value);
        grid.appendChild(card);
      });

      sectionElement.appendChild(grid);

    } else if(index === 10) {
      const wrapper = document.createElement("div");
      wrapper.className = "card";

      const timeline = document.createElement("div");
      timeline.className = "timeline";

      section[1].forEach(item => {
        const entry = document.createElement("div");
        entry.className = "timeline-item";

        const year = document.createElement("h3");
        year.textContent = item[0];

        const description = document.createElement("p");
        description.textContent = item[1];

        entry.append(year,description);
        timeline.appendChild(entry);
      });

      wrapper.appendChild(timeline);
      sectionElement.appendChild(wrapper);

    } else {
      section[1].forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h3");
        title.textContent = item[0];

        const paragraph = document.createElement("p");
        paragraph.textContent = item[1];

        card.append(title,paragraph);
        sectionElement.appendChild(card);
      });
    }

    content.appendChild(sectionElement);
  });

  document.querySelectorAll(".languages button").forEach(button => {
    button.classList.toggle("active",button.dataset.lang === lang);
  });
}

document.querySelectorAll(".languages button").forEach(button => {
  button.addEventListener("click",() => {
    render(button.dataset.lang);
    window.scrollTo({top:0,behavior:"smooth"});
  });
});

render("zh-CN");
